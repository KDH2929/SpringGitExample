<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{include/header :: header}">
    <title>게시글 삭제</title>
</head>
<body>
<div th:replace="~{include/body-header :: bodyHeader}"></div>

<div class="container">
    <div class="pg-opt">
        <h2>게시글 삭제 확인</h2>
    </div>

    <div class="content">
        <form th:action="@{/board/delete}" method="post" class="form-horizontal">
            
            <input type="hidden" name="boardId" th:value="${boardId}">
            <input type="hidden" name="categoryId" th:value="${categoryId}">
            <input type="hidden" name="replyNumber" th:value="${replyNumber}">

            <div class="form-group">
                <label>비밀번호 입력</label>
                <input type="password" name="password" class="form-control" required>
                <p th:if="${message != null}" style="color:red;">[[#{${message}}]]</p>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-danger">삭제하기</button>
                <a th:href="@{/board/cat/{catId}(catId=${categoryId})}" class="btn btn-default">취소</a>
            </div>
        </form>
    </div>
</div>

<footer th:replace="~{include/footer :: footer}"></footer>
</body>
</html>
